<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas GPU de la malla</title><style>body{background:#050a10;color:#e4efff;font:14px system-ui}pre{white-space:pre-wrap}canvas{width:640px;height:400px}button{padding:12px}</style><h1>GPU · cilindro, reloj sutil e interacción</h1><button>Ejecutar</button><pre id="result">Listo.</pre><canvas></canvas><script type="module">
import {createMeshCore} from '../js/core-mesh-renderer.js';import {interlockedRings} from '../js/particle-motion.js';
const canvas=document.querySelector('canvas'),out=document.querySelector('pre'),empty=new Float32Array(32);
document.querySelector('button').onclick=async()=>{
 let core;const rows=[],assert=(ok,label)=>{if(!ok)throw Error(label);rows.push('✓ '+label);},gl=canvas.getContext('webgl2',{alpha:true,antialias:false,premultipliedAlpha:true});
 const kinds=['Buffer','Texture','Framebuffer','Renderbuffer','VertexArray','TransformFeedback','Program','Shader'],resources=new Map(kinds.map(k=>[k,new Set()])),originals=[];
 for(const kind of kinds){for(const verb of ['create','delete']){const name=verb+kind,original=gl[name].bind(gl);originals.push([name,original]);gl[name]=(...args)=>{const value=original(...args);if(verb==='create')resources.get(kind).add(value);else resources.get(kind).delete(args[0]);return value;};}}
 try{
  core=createMeshCore(canvas,{inspection:true,debug:true});assert(!!core,'Renderer y shaders creados');core.resize(800,500);core.draw(0);const inspector=core.inspect;
  const sample=(offset=0,n=256)=>{const v=new Float32Array(n*3);gl.bindBuffer(gl.ARRAY_BUFFER,inspector.state.position);gl.getBufferSubData(gl.ARRAY_BUFFER,offset*12,v);gl.bindBuffer(gl.ARRAY_BUFFER,null);return v;},dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
  const start=sample();for(let i=1;i<=300;i++){core.draw(i/60,0,empty);if(i%30===0)await new Promise(requestAnimationFrame);}const assembled=sample();
  assert(dist(start,assembled)>.1&&canvas.dataset.particlePhase==='orbiting','Ensamblado gradual hasta las órbitas');
  const shape=interlockedRings(5),count=Number(canvas.dataset.particleCount),dustOffset=inspector.groups.ring+inspector.groups.gap,dust=sample(dustOffset,200),scale=.82;let aligned=0,waist=0,ends=0;
  for(let i=0;i<dust.length;i+=3){const p=[dust[i]/scale,dust[i+1]/scale,(dust[i+2]-shape.pose.depth)/scale],axial=p.reduce((s,v,j)=>s+v*shape.pose.direction[j],0),radius=Math.sqrt(Math.max(0,p.reduce((s,v)=>s+v*v,0)-axial*axial));if(radius<.055&&Math.abs(axial)<.47)aligned++;if(Math.abs(axial)<.08&&radius<.02)waist++;if(Math.abs(axial)>.26&&radius>.018)ends++;}
  assert(aligned>190&&waist>10&&ends>20,'Remolino axial: cintura pequeña y extremos sutiles');
  const trail=new Float32Array(32),p=sample();const half=Math.tan(24*Math.PI/180),z=p[2];trail.set([p[0]/(2*half*(1.12-z))+.376,p[1]/(2*half*(1.12-z))+.055,1,1]);
  const before=sample();for(let i=1;i<=20;i++)core.draw(5+i/60,0,trail);const pushed=sample();assert(dist(before,pushed)>.004,'El puntero perturba la simulación GPU');
  core.draw(5+21/60,0,empty);assert(dist(pushed,sample())<.06,'La retirada del puntero conserva inercia');
  for(let i=22;i<=180;i++){core.draw(5+i/60,0,empty);if(i%30===0)await new Promise(requestAnimationFrame);}assert([...sample(),...sample(dustOffset)].every(Number.isFinite),'Posiciones finitas en C y remolino');
  const attrs=inspector.particles.material;assert(attrs.depthTest&&attrs.depthWrite&&attrs.blending===1,'Partículas con depth test, escritura y NormalBlending');assert(inspector.beam.geometry.type==='CylinderGeometry'&&inspector.beam.geometry.parameters.radialSegments>=32,'Cilindro con segmentos suficientes');
  const beforeTextures=resources.get('Texture').size;for(const [w,h]of [[390,844],[1200,800],[390,844]]){core.resize(w,h);core.draw(9);assert(gl.getError()===gl.NO_ERROR,'Resize '+w+'×'+h+' sin errores GL');}
  assert(resources.get('Texture').size<=beforeTextures,'Resize libera los targets anteriores sin acumular texturas');assert(Number(canvas.dataset.particleCount)===3200&&Number(canvas.dataset.pixelRatio)<=2&&canvas.dataset.beamDustCount==='250','Presupuesto móvil y remolino restaurado');
  core.dispose();core=null;
  assert(gl.isContextLost()&&[...resources].every(([kind,items])=>[...items].every(item=>!gl['is'+kind](item))),'Limpieza completa: dispose y liberación del contexto exclusivo, incluidos recursos internos de Three.js');
  out.textContent=rows.join('\n')+'\nTODAS CORRECTAS';out.dataset.status='passed';
 }catch(error){out.textContent=rows.join('\n')+'\n✗ '+error.message;out.dataset.status='failed';console.error(error);}
 finally{core?.dispose();for(const [name,original]of originals)gl[name]=original;}
};</script></html>
