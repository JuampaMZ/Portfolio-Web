<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esferas · profundidad e interacción GPU</title>
<style>body{background:#03070d;color:#e4efff;font:14px system-ui}button{padding:12px}pre{white-space:pre-wrap}canvas{width:640px;height:400px}</style><h1>Superficie esférica e interacción tridimensional</h1><button>Verificar GPU</button><pre>Listo.</pre><canvas></canvas><script type="module">
import * as THREE from '../assets/three-runtime.js';
import {createMeshCore} from '../js/core-mesh-renderer.js';
const canvas=document.querySelector('canvas'),out=document.querySelector('pre');
document.querySelector('button').onclick=()=>{
 let core,target;const rows=[],assert=(ok,label)=>{if(!ok)throw Error(label);rows.push('✓ '+label);};
 try{
  core=createMeshCore(canvas,{inspection:true,singleRing:true});core.resize(800,500);core.draw(0);core.draw(50);
  const {renderer,scene,camera,beam,particles,state}=core.inspect,gl=renderer.getContext(),u=particles.material.uniforms;
  const read=buffer=>{const data=new Float32Array(192*3);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.getBufferSubData(gl.ARRAY_BUFFER,0,data);gl.bindBuffer(gl.ARRAY_BUFFER,null);return data;};
  const empty=new Float32Array(32),initial=read(state.position),trail=new Float32Array(32),half=Math.tan(camera.fov*Math.PI/360),p=initial.slice(0,3);
  trail.set([p[0]/(2*half*(camera.position.z-p[2])),p[1]/(2*half*(camera.position.z-p[2])),1,1]);
  for(let i=1;i<=24;i++)core.draw(50+i/60,0,trail);
  const pushed=read(state.velocity);let active=0,positive=0,negative=0;
  for(let i=2;i<pushed.length;i+=3){if(Math.abs(pushed[i])>.01)active++;if(pushed[i]>.01)positive++;if(pushed[i]<-.01)negative++;}
  assert(active>8&&positive>2&&negative>2,'El puntero genera velocidades Z positivas y negativas: '+positive+' / '+negative+' partículas');
  const energy=v=>v.reduce((s,x)=>s+x*x,0);const disturbed=energy(pushed);
  for(let i=25;i<=204;i++)core.draw(50+i/60,0,empty);
  assert(energy(read(state.velocity))<disturbed,'El resorte amortigua la perturbación sin detener el movimiento orbital');
  // Isolate one real impostor, retaining its native vertex/fragment shader and depth write.
  beam.visible=false;particles.geometry.setDrawRange(0,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,state.position);gl.bufferSubData(gl.ARRAY_BUFFER,0,new Float32Array([0,0,0]));gl.bindBuffer(gl.ARRAY_BUFFER,null);renderer.resetState();
  let hash=2;hash^=hash>>>16;hash=Math.imul(hash,0x7feb352d);hash^=hash>>>15;hash=Math.imul(hash,0x846ca68b);hash^=hash>>>16;
  const radius=.04;u.uSphereRadius.value=radius/(.75+(hash>>>0)/4294967295*.5);u.uDofStrength.value=0;core.setDebug(2);
  target=new THREE.WebGLRenderTarget(canvas.width,canvas.height);renderer.setRenderTarget(target);renderer.clear();renderer.render(scene,camera);
  const bytes=new Uint8Array(canvas.width*canvas.height*4);renderer.readRenderTargetPixels(target,0,0,canvas.width,canvas.height,bytes);
  const center=new THREE.Vector3(0,0,0).project(camera),cx=Math.floor((center.x*.5+.5)*canvas.width),cy=Math.floor((center.y*.5+.5)*canvas.height),focal=canvas.height/(2*half),edge=Math.floor(radius*focal/camera.position.z*.65),depths=[];
  for(const dx of [0,edge,-edge]){
   const x=cx+dx,y=cy,ray=new THREE.Vector3((x+.5)/canvas.width*2-1,(y+.5)/canvas.height*2-1,1).unproject(camera).sub(camera.position).normalize();
   const C=new THREE.Vector3(0,0,0).sub(camera.position),along=ray.dot(C),disc=along*along-C.lengthSq()+radius*radius;
   assert(disc>0,'La muestra cae dentro de la esfera');
   const hit=camera.position.clone().addScaledVector(ray,along-Math.sqrt(disc)),expected=hit.project(camera).z*.5+.5,index=(y*canvas.width+x)*4;
   const actual=(bytes[index]*65536+bytes[index+1]*256+bytes[index+2])/16777215;
   assert(bytes[index+3]===255&&Math.abs(actual-expected)<2e-6,'gl_FragDepth coincide con la superficie real (error '+Math.abs(actual-expected).toExponential(2)+')');depths.push(actual);
  }
  assert(depths[0]<Math.min(depths[1],depths[2]),'El centro es más cercano que los bordes: profundidad curva, no plano');
  assert(gl.getError()===gl.NO_ERROR,'Sin errores WebGL');out.dataset.status='passed';
 }catch(error){rows.push('✗ '+error.message);out.dataset.status='failed';console.error(error);}
 finally{out.textContent=rows.join('\n');target?.dispose();core?.dispose();}
};
</script></html>
