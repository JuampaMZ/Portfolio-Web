<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba aislada · profundidad real</title>
<style>body{margin:0;background:#03070d;color:#dfeafa;font:13px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;z-index:2;left:24px;top:20px;max-width:330px;background:#03070dbb;padding:16px;border:1px solid #334451;border-radius:12px}a,button{color:#dfeafa;background:#182331;border:1px solid #456;padding:6px;cursor:pointer}pre{font:12px monospace;white-space:pre-wrap}</style>
<canvas></canvas><aside><b>Un cilindro + un anillo · depth buffer</b><p>Rojo: delante · Azul: detrás. El debug solo cambia el color.</p><button id="all">Verificar 3 momentos</button> <button id="debug">Cambiar debug / material</button> <a href="?time=50&debug=1">Reposo</a> <a href="?time=58&debug=1">Diagonal</a> <a href="?time=75&debug=1">Inversión</a><pre id="result">Cargando…</pre></aside>
<script type="module">
import {PARTICLE_CONFIG as config} from '../js/particle-config.js';if(['A','B'].includes(new URLSearchParams(location.search).get('beam')))config.beamVariant=new URLSearchParams(location.search).get('beam');
import {verifyFrame} from './mesh-checks.js';
import {createMeshCore} from '../js/core-mesh-renderer.js';
const canvas=document.querySelector('canvas'),query=new URLSearchParams(location.search),time=Number(query.get('time')||50);let debug=query.get('debug')!=='0';
const full=query.get('full')==='1';if(full){document.querySelector('b').textContent='Escena completa: cilindro + dos C + reloj sutil';document.querySelectorAll('a').forEach(a=>a.href+='&full=1');}const core=createMeshCore(canvas,{singleRing:!full,debug,inspection:true});
function resize(){core.resize(innerWidth,innerHeight);core.draw(0);core.resize(innerWidth,innerHeight,true);core.draw(time);try{const results=full?[...verifyFrame(core,time,canvas,0),...verifyFrame(core,time,canvas,1)]:verifyFrame(core,time,canvas);document.querySelector('pre').textContent=results.map(s=>'✓ '+s).join('\n');document.body.dataset.checks='passed';}catch(error){document.querySelector('pre').textContent=error.message;document.body.dataset.checks='failed';console.error(error);}core.draw(time);}
resize();document.querySelector('#debug').onclick=()=>{debug=!debug;core.setDebug(debug);core.draw(time);};window.addEventListener('resize',resize);window.addEventListener('pagehide',()=>core.dispose(),{once:true});
document.querySelector('#all').onclick=()=>{const wasDebug=debug;core.setDebug(true);try{const rows=[];for(const frameTime of [50,58,75]){core.resize(innerWidth,innerHeight,true);core.draw(frameTime);for(const index of (full?[0,1]:[0]))rows.push(...verifyFrame(core,frameTime,canvas,index).map(message=>'t='+frameTime+' · '+message));}document.querySelector('pre').textContent=rows.map(s=>'✓ '+s).join('\n');document.body.dataset.checks='passed';document.body.dataset.checkCount=String(rows.length);}catch(error){document.querySelector('pre').textContent=error.message;document.body.dataset.checks='failed';console.error(error);}finally{core.resize(innerWidth,innerHeight,true);core.setDebug(wasDebug);core.draw(time);}};
document.body.dataset.status=core?'ready':'failed';
</script></html>
