<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación GPU del núcleo</title>
<style>body{margin:20px;background:#04080d;color:#e9efff;font:14px system-ui}canvas{width:760px;height:500px;max-width:100%;border:1px solid #31445f}pre{white-space:pre-wrap}button{padding:10px;margin-bottom:12px}</style>
<h1>Verificación GPU del núcleo orbital</h1><button id="run">Ejecutar comprobaciones</button><pre id="result">Listo para comprobar.</pre><div id="canvases"></div>
<script type="module">
import {createCinemaRenderer} from '../js/cinema-renderer.js';
import {initAtmosphere,createGalaxyRenderer} from '../js/atmosphere.js';
import {createAuroraRenderer} from '../js/aurora-renderer.js';
import {interlockedRings} from '../js/particle-motion.js';
import {PARTICLE_CONFIG as config,introState} from '../js/particle-config.js';
const output=document.querySelector('pre'),host=document.querySelector('#canvases');
function tracked(){
 const canvas=document.createElement('canvas');host.append(canvas);
 const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false});
 const kinds=['Buffer','Program','Shader','VertexArray','TransformFeedback'],resources=new Map(kinds.map(kind=>[kind,new Set()]));
 for(const kind of kinds){
  const create=gl['create'+kind].bind(gl),destroy=gl['delete'+kind].bind(gl);
  gl['create'+kind]=(...args)=>{const value=create(...args);resources.get(kind).add(value);return value;};
  gl['delete'+kind]=value=>{resources.get(kind).delete(value);return destroy(value);};
 }
 let latest=null;const draw=gl.drawArrays.bind(gl);
 gl.drawArrays=(...args)=>{if(!gl.isEnabled(gl.RASTERIZER_DISCARD))latest=gl.getVertexAttrib(0,gl.VERTEX_ATTRIB_ARRAY_BUFFER_BINDING);return draw(...args);};
 return {canvas,gl,resources,sample(){const data=new Float32Array(256*6);gl.bindBuffer(gl.ARRAY_BUFFER,latest);gl.getBufferSubData(gl.ARRAY_BUFFER,0,data);gl.bindBuffer(gl.ARRAY_BUFFER,null);return data;},beam(){const p=new Uint8Array(4);gl.readPixels(Math.floor(canvas.width*.735),Math.floor(canvas.height*.555),1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);return p[0]+p[1]+p[2];}};
}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
document.querySelector('button').addEventListener('click',async()=>{
 output.textContent='Ejecutando comprobaciones GPU…';await new Promise(requestAnimationFrame);
 const results=[],assert=(condition,label)=>{if(!condition)throw new Error(label);results.push('✓ '+label);};
 const a=tracked(),b=tracked();let control=null,perturbed=null,field=null,atmosphere=null,aurora=null,foreground=null;const oldRadius=config.repulsionRadius;
 try{
  control=createCinemaRenderer(a.canvas);perturbed=createCinemaRenderer(b.canvas);assert(Boolean(control&&perturbed),'Shaders de órbitas y nube compilados');
  control.resize(800,500);perturbed.resize(800,500);const empty=new Float32Array(32);
  control.draw(0,0,empty);perturbed.draw(0,0,empty);const start=a.sample(),startBeam=a.beam();
  for(let i=1;i<=300;i++){control.draw(i/60,0,empty);perturbed.draw(i/60,0,empty);if(i%60===0)await new Promise(requestAnimationFrame);}
  // Present in the current task before reading a non-preserved drawing buffer.
  control.draw(5,0,empty);perturbed.draw(5,0,empty);const assembled=a.sample();
  const scene=interlockedRings(5),pose=scene.pose,center=[.376*(1-pose.depth*.38),.055*(1-pose.depth*.38),pose.depth],samples=[[],[]];
  for(let i=0;i<assembled.length;i+=6){
   const p=[0,1,2].map(j=>(assembled[i+j]-center[j])/1.06),local=scene.frames.map(f=>{const m=f.basis,x=m[0]*p[0]+m[1]*p[1]+m[2]*p[2],y=m[3]*p[0]+m[4]*p[1]+m[5]*p[2],z=m[6]*p[0]+m[7]*p[1]+m[8]*p[2];return {r:Math.hypot(x,z),y,angle:Math.atan2(z,x),error:Math.hypot(Math.hypot(x,z)-f.radius,y)};});
   const index=local[0].error<local[1].error?0:1;if(local[index].error<.085)samples[index].push(local[index]);
  }
  assert(samples.every(values=>values.length>70&&Math.max(...values.map(v=>v.r))-Math.min(...values.map(v=>v.r))>.03&&Math.max(...values.map(v=>v.y))-Math.min(...values.map(v=>v.y))>.025),'Dos bandas volumétricas presentes en planos distintos');
  assert(samples.every((values,index)=>values.filter(v=>Math.abs(Math.atan2(Math.sin(v.angle-index*Math.PI),Math.cos(v.angle-index*Math.PI)))>scene.geometry.gap/2-.15).length>values.length*.94),'Los huecos opuestos quedan abiertos en la simulación GPU');assert(dist(start,assembled)>.1,'Ensamblado gradual desde posiciones dispersas');
  assert(a.beam()>startBeam+200&&introState(3.45).text===0,'El rayo crece antes de la entrada de textos');
  assert(dist(a.sample(),b.sample())<.00001,'Simulaciones independientes reproducibles');
  const trail=new Float32Array(32);trail.set([assembled[0]/(1-assembled[2]*.38),assembled[1]/(1-assembled[2]*.38),1,1]);
  for(let i=1;i<=30;i++){control.draw(5+i/60,0,empty);perturbed.draw(5+i/60,0,trail);}
  const moving=a.sample(),pushed=b.sample();assert(dist(assembled,moving)>.003,'Las órbitas avanzan sin scroll ni puntero');
  assert(dist(moving,pushed)>.005,'El puntero perturba órbitas con fuerza integrada en GPU');
  assert(a.beam()>500&&b.beam()>500,'El rayo sigue continuo durante la perturbación');
  control.draw(5.5+1/60,0,empty);perturbed.draw(5.5+1/60,0,empty);
  assert(dist(a.sample(),b.sample())>.002&&dist(pushed,b.sample())<.05,'Retirar el puntero conserva inercia sin recolocación instantánea');
  for(let i=2;i<=180;i++){control.draw(5.5+i/60,0,empty);perturbed.draw(5.5+i/60,0,empty);if(i%60===0)await new Promise(requestAnimationFrame);}
  assert(dist(a.sample(),b.sample())<.002,'Las partículas recuperan sus órbitas móviles');
  assert([...a.sample(),...b.sample()].every(Number.isFinite),'Órbitas, espirales y expulsiones mantienen valores finitos');
  control.resize(390,844);control.draw(9,0,empty);
  assert(Number(a.canvas.dataset.particleCount)<=10000&&Number(a.canvas.dataset.pixelRatio)<=2,'Resize reduce partículas y DPR en móvil');
  assert(a.canvas.dataset.particlePhase==='orbiting','El resize no reinicia la entrada ni detiene la animación');
  assert(a.resources.get('Buffer').size===2&&a.resources.get('VertexArray').size===2&&a.resources.get('TransformFeedback').size===2,'Resize libera los buffers anteriores');
  assert(a.gl.getError()===a.gl.NO_ERROR&&b.gl.getError()===b.gl.NO_ERROR,'Núcleo sin errores WebGL');
  control.dispose();perturbed.dispose();assert([...a.resources.values(),...b.resources.values()].every(values=>values.size===0),'Desmontaje libera todos los recursos del núcleo');
  const g=tracked();field=createGalaxyRenderer(g.canvas);field.resize();config.repulsionRadius=5000;
  field.draw(0,empty);const wide=new Float32Array(32);wide.set([0,0,1,1]);
  for(let i=1;i<=30;i++)field.draw(i/60,wide);
  const diverted=g.sample();assert(Math.hypot(diverted[0],diverted[1])>.01,'El campo galáctico también esquiva el puntero en GPU');
  field.draw(31/60,empty);assert(Math.hypot(...g.sample().slice(0,2))>.005,'El campo conserva la estela con inercia');
  for(let i=32;i<=210;i++)field.draw(i/60,empty);
  assert(Math.hypot(...g.sample().slice(0,2))<.002,'Las estrellas retoman su deriva original');
  assert(g.gl.getError()===g.gl.NO_ERROR,'Galaxia sin errores WebGL');field.dispose();assert([...g.resources.values()].every(values=>values.size===0),'Desmontaje libera todos los recursos galácticos');
  config.repulsionRadius=oldRadius;
  const near=tracked();foreground=createGalaxyRenderer(near.canvas,true);foreground.resize();
  const foregroundAlpha=()=>{const pixels=new Uint8Array(near.canvas.width*near.canvas.height*4);near.gl.readPixels(0,0,near.canvas.width,near.canvas.height,near.gl.RGBA,near.gl.UNSIGNED_BYTE,pixels);let sum=0;for(let i=3;i<pixels.length;i+=4)sum+=pixels[i];return sum;};
  foreground.draw(0,empty);const unmasked=foregroundAlpha();assert(unmasked>100,'Bokeh frontal visible en GPU');
  const textMask=new Float32Array(48);textMask.set([-10,-10,10,10]);foreground.draw(0,empty,textMask,1);
  assert(foregroundAlpha()<unmasked*.2,'La capa frontal protege el texto y evita concentraciones');
  assert(near.gl.getError()===near.gl.NO_ERROR,'Bokeh frontal sin errores WebGL');foreground.dispose();assert([...near.resources.values()].every(values=>values.size===0),'Desmontaje libera los recursos frontales');
  const sky=tracked();aurora=createAuroraRenderer(sky.canvas);assert(Boolean(aurora),'Shader de aurora compilado');aurora.resize();
  const frame=()=>{const data=new Uint8Array(sky.canvas.width*sky.canvas.height*4);sky.gl.readPixels(0,0,sky.canvas.width,sky.canvas.height,sky.gl.RGBA,sky.gl.UNSIGNED_BYTE,data);return data;};
  const alphaSum=data=>{let sum=0;for(let i=3;i<data.length;i+=4)sum+=data[i];return sum;};
  const difference=(x,y)=>{let sum=0;for(let i=0;i<x.length;i++)sum+=Math.abs(x[i]-y[i]);return sum;};
  aurora.draw(0,0,empty);const initialSky=frame();assert(alphaSum(initialSky)>1000,'Aurora visible y generada en GPU');
  aurora.draw(20,0,empty);const flowingSky=frame();assert(difference(initialSky,flowingSky)>1000,'Aurora cambia sin depender del scroll');
  aurora.draw(20,2,empty);const scrolledSky=frame();assert(difference(flowingSky,scrolledSky)>1000,'Scroll desplaza y cambia las cortinas y su paleta');
  let brightest=3;for(let i=7;i<scrolledSky.length;i+=4)if(scrolledSky[i]>scrolledSky[brightest])brightest=i;
  const pixel=(brightest-3)/4,w=sky.canvas.width,h=sky.canvas.height,auroraTrail=new Float32Array(32);auroraTrail.set([((pixel%w)+.5-w*.5)/h,(Math.floor(pixel/w)+.5-h*.5)/h,1,1]);
  aurora.draw(20,2,auroraTrail);assert(difference(scrolledSky,frame())>50,'Puntero perturba localmente la aurora');
  const mask=new Float32Array(48);mask.set([-10,-10,10,10]);aurora.draw(20,2,empty,mask,1);assert(alphaSum(frame())<alphaSum(scrolledSky)*.5,'Aurora baja su intensidad detrás del texto');
  assert(Number(sky.canvas.dataset.resolutionScale)<=.5,'Aurora usa resolución reducida');assert(sky.gl.getError()===sky.gl.NO_ERROR,'Aurora sin errores WebGL');
  aurora.dispose();assert([...sky.resources.values()].every(values=>values.size===0),'Desmontaje libera los recursos de la aurora');
  atmosphere=initAtmosphere();
  assert(document.querySelectorAll('.ambient-layer').length===2&&document.querySelector('.aurora-layer'),'Capas de fondo, frente y nebulosa creadas');
  atmosphere.dispose();assert(document.querySelectorAll('.ambient-layer,.aurora-layer').length===0,'Desmontaje retira canvas, nebulosa y listeners');
  output.textContent=results.join('\n')+'\n\nTODAS LAS COMPROBACIONES CORRECTAS';output.dataset.status='passed';
 }catch(error){output.textContent=results.join('\n')+'\n✗ '+error.message;output.dataset.status='failed';console.error(error);}
 finally{config.repulsionRadius=oldRadius;control?.dispose();perturbed?.dispose();field?.dispose();foreground?.dispose();aurora?.dispose();atmosphere?.dispose();}
});
</script></html>
