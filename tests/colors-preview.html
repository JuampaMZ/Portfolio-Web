<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación de esferas y transición OKLab</title><style>body{margin:0;background:#03070d;color:#e4efff;font:13px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;z-index:2;top:12px;left:12px;width:410px;max-height:95vh;overflow:auto;background:#03070ddd;padding:14px}button{padding:10px}pre{white-space:pre-wrap}</style><canvas></canvas><aside><button id="run">Verificar color y profundidad</button><pre id="result">Listo.</pre></aside><script type="module">
import {createMeshCore} from '../js/core-mesh-renderer.js';import {verifyColorFrame} from './color-checks.js';import {verifyFrame} from './mesh-checks.js';
const canvas=document.querySelector('canvas'),output=document.querySelector('pre'),core=createMeshCore(canvas,{inspection:true});
const reset=t=>{core.resize(innerWidth,innerHeight,true);core.draw(t);};core.resize(innerWidth,innerHeight);core.draw(0);reset(50);
document.querySelector('button').onclick=()=>{try{reset(50);const colors=verifyColorFrame(core,canvas,50),depth=[];core.setDebug(true);for(const t of [50,58,75]){reset(t);for(const ring of [0,1])depth.push(...verifyFrame(core,t,canvas,ring));}output.textContent=colors.map(s=>'✓ '+s).join('\n')+'\n✓ '+depth.length+' comprobaciones de cruce en tres momentos';output.dataset.status='passed';output.dataset.count=String(colors.length+depth.length);}catch(error){output.textContent=error.message;output.dataset.status='failed';console.error(error);}finally{core.setDebug(false);reset(50);}};
window.addEventListener('pagehide',()=>core.dispose(),{once:true});
</script></html>
