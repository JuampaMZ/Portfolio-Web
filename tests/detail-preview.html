<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle de esferas e interacción</title><style>body{margin:0;background:#03070d;color:#e4efff;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;top:20px;left:20px;padding:16px;background:#07111de6;max-width:280px;z-index:2}button{padding:10px}</style><canvas></canvas><aside>Esferas con profundidad, luz del rayo y reflejos.<p>Captura reproducible de la onda 3D.</p><button>Perturbar órbitas</button><p id="status">Órbitas en reposo</p></aside><script type="module">
import {createMeshCore} from '../js/core-mesh-renderer.js';
import * as THREE from '../assets/three-runtime.js';
const canvas=document.querySelector('canvas'),core=createMeshCore(canvas,{inspection:true}),time=50;
function reset(){core.resize(innerWidth,innerHeight,true);core.draw(0);core.resize(innerWidth,innerHeight,true);core.draw(time);}
reset();document.querySelector('button').onclick=()=>{
 reset();const {renderer,state,camera}=core.inspect,gl=renderer.getContext(),point=new Float32Array(3);gl.bindBuffer(gl.ARRAY_BUFFER,state.position);gl.getBufferSubData(gl.ARRAY_BUFFER,0,point);gl.bindBuffer(gl.ARRAY_BUFFER,null);
 const p=new THREE.Vector3(...point).project(camera),trail=new Float32Array(32);trail.set([p.x*innerWidth/innerHeight*.5,p.y*.5,1,1]);
 for(let i=1;i<=24;i++)core.draw(time+i/60,0,trail);
 document.querySelector('#status').textContent='Onda 3D: desvío, giro y separación en profundidad';document.body.dataset.perturbed='true';
};window.addEventListener('resize',reset);window.addEventListener('pagehide',()=>core.dispose(),{once:true});
</script></html>
